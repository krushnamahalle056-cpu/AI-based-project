<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="converter-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form action="convert">

            <!-- Amount -->
            <div class="amount">
                <label for="amount">Enter Amount</label>
                <input id="amount" name="amount" type="number" value="100">
            </div>

           <div class="dropdown">
                <div class="form">
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="flagicon">
                        <label for="form">from</label>
                        <select name="form" id="form">
                            <option value="USD">USD</option>
                            <option value="IN">IND</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>

                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to">
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="flagicon">
                        <label for="form">from</label>
                        <select name="form" id="form">
                            <option value="USD">USD</option>
                            <option value="IN" selected>IND</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>
                </div>
           </div>
           <div class="msg">1USD = 80INR</div>
           <button type="button">Get Exchange Rate</button>
        </form>
    </div>


    <script src="monyPart.js"></script>
</body>
</html>
