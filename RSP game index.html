<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper scissors game</title>
  <link rel="stylesheet" href="RSP game style.css">
</head>
<body>
  <h1 class="heading">Rock Paper Scissors</h1>
  <div class="choices">
    <div class="choise" id="rock">
        <img src="rock.png" alt="rock" >
    </div>
    <div class="choise" id="paper">
        <img src="paper.png" alt="paper">
    </div>
    <div class="choise" id="scissors">
        <img src="scissors.png" alt="scissors">
    </div>
  </div>

  <div class="score-bord">
    <div class="score">
      <p id="user-score">0</p>
      <p>you</p>
    </div>
    <div class="score">
      <p id="comp-score">0</p>
      <p>comp</p>
    </div>
  </div>

  <div class="msg-container">
    <p id="msg">Play your move</p>
  </div>
  


  <Script src="RSP game part.js"></Script>
</body>
</html>
